<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Itloe — simulator</title>
  <style>
    body { margin: 0; background: #000; display: grid; grid-template-rows: 1fr 1fr; height: 100vh; }
    iframe { border: 1px solid #333; width: 100%; height: 100%; background: #111418; }
    .phones { display: grid; grid-template-columns: repeat(4, 1fr); }
  </style>
</head>
<body>
  <iframe src="/screen/" title="screen"></iframe>
  <div class="phones" id="phones"></div>
  <script>
    // slot= namespaces localStorage per iframe (otherwise all four rejoin as the same player);
    // room= comes from /api/join so the real server's room check passes (mock has no /api, no room needed).
    (async () => {
      let room = '';
      try {
        const res = await fetch('/api/join');
        if (res.ok) room = '&room=' + encodeURIComponent((await res.json()).code);
      } catch { /* mock server: no /api/join */ }
      const phones = document.getElementById('phones');
      for (let i = 1; i <= 4; i++) {
        const frame = document.createElement('iframe');
        frame.src = `/play/?slot=${i}${room}`;
        frame.title = `player ${i}`;
        phones.append(frame);
      }
    })();
  </script>
</body>
</html>
