<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bloko — simulator</title>
  <style>
    body { margin: 0; background: #000; display: grid; grid-template-rows: 1fr 1fr; height: 100vh; }
    iframe { border: 1px solid #333; width: 100%; height: 100%; background: #111418; }
    .phones { display: grid; grid-template-columns: repeat(4, 1fr); }
  </style>
</head>
<body>
  <iframe src="/screen/" title="screen"></iframe>
  <div class="phones">
    <iframe src="/play/" title="player 1"></iframe>
    <iframe src="/play/" title="player 2"></iframe>
    <iframe src="/play/" title="player 3"></iframe>
    <iframe src="/play/" title="player 4"></iframe>
  </div>
</body>
</html>
